packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

# pnpm >= 11 wants an explicit per-package build approval in addition to the
# onlyBuiltDependencies allowlist below (older pnpm, e.g. on Replit, ignores
# this key and just reads the list).
allowBuilds:
  '@swc/core': true
  esbuild: true
  msw: true
  unrs-resolver: true

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: 4.23.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - '@lovable.dev/*'
  - stripe-replit-sync

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

# Native prebuilt-binary packages (esbuild, rollup, lightningcss,
# @tailwindcss/oxide) are NOT pruned here: they ship as optionalDependencies
# tagged with os/cpu, so pnpm already installs only the one matching the host
# (linux-x64 on Replit, win32-x64 locally, etc). Pruning them broke local
# installs on Windows/macOS. @expo/ngrok-bin is still pruned — it's large and
# only Replit's dev tunnel uses it.
overrides:
  # One React across the whole workspace. wodplace (Expo SDK 54) needs 19.1.0,
  # and a second copy (box-admin/super-admin pinned ^19.2) makes Metro bundle
  # React twice -> "Cannot read property 'useState' of null" in Expo Go.
  react: 19.1.0
  react-dom: 19.1.0
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  esbuild: 0.27.3
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-arm': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-sunos-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-win32-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-win32-x64': '-'
